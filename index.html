<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clip-it | YouTube Video Clipper & Local Video Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/ffmpeg@0.12.6/dist/ffmpeg.min.js"></script>
    <style>
      :root {
        --bg-dark: #0f172a;
        --bg-light: #f8fafc;
        --panel: #ffffff;
        --accent: #7c3aed;
        --accent-2: #ef4444;
        --text: #111827;
        --muted: #475569;
        --success: #16a34a;
        --warning: #f59e0b;
        --shadow: rgba(15, 23, 42, 0.18);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1e293b 0%, #334155 45%, #7c3aed 100%);
        min-height: 100vh;
        color: var(--text);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      .card {
        background: rgba(255, 255, 255, 0.96);
        border-radius: 18px;
        box-shadow: 0 22px 60px var(--shadow);
        overflow: hidden;
      }

      header {
        background: linear-gradient(135deg, var(--accent-2) 0%, #991b1b 100%);
        color: white;
        padding: 40px 24px;
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      header p {
        margin: 0;
        opacity: 0.92;
        font-size: 1.1rem;
      }

      .main {
        padding: 32px 20px 40px;
      }

      .tabs {
        display: flex;
        gap: 12px;
        margin-bottom: 28px;
        border-bottom: 2px solid #e2e8f0;
      }

      .tab-button {
        background: none;
        border: none;
        padding: 12px 20px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        color: var(--muted);
        border-bottom: 3px solid transparent;
        transition: all 0.2s ease;
      }

      .tab-button.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }

      .tab-button:hover {
        color: var(--text);
      }

      .tab-content {
        display: none;
      }

      .tab-content.active {
        display: block;
      }

      .input-panel {
        max-width: 820px;
        margin: 0 auto 28px;
        text-align: center;
      }

      label {
        display: block;
        margin-bottom: 10px;
        font-weight: 700;
        color: var(--muted);
      }

      input[type="text"],
      input[type="number"],
      input[type="file"],
      select {
        width: 100%;
        padding: 14px 16px;
        font-size: 1rem;
        border: 2px solid #dfe7f1;
        border-radius: 10px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input[type="text"]:focus,
      input[type="number"]:focus,
      input[type="file"]:focus,
      select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
      }

      input[type="file"]::file-selector-button {
        background: var(--accent);
        color: white;
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 700;
        margin-right: 10px;
      }

      input[type="file"]::file-selector-button:hover {
        background: #6d28d9;
      }

      #youtube-url {
        margin-bottom: 14px;
      }

      #video-file {
        margin-bottom: 14px;
      }

      button,
      .download-btn {
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      }

      button:hover,
      .download-btn:hover {
        transform: translateY(-1px);
      }

      .primary-btn {
        background: linear-gradient(135deg, var(--accent) 0%, #4f46e5 100%);
        color: white;
        padding: 14px 28px;
        font-size: 1rem;
      }

      .primary-btn:hover {
        box-shadow: 0 10px 22px rgba(124, 58, 237, 0.3);
      }

      .video-panel {
        max-width: 1040px;
        margin: 0 auto;
      }

      .hidden {
        display: none !important;
      }

      .video-frame-selector {
        max-width: 820px;
        margin: 0 auto 20px;
        padding: 16px;
        background: #f1f5f9;
        border-radius: 10px;
      }

      .frame-options {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
        margin-top: 10px;
      }

      .frame-option {
        padding: 12px;
        border: 2px solid #dfe7f1;
        border-radius: 8px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .frame-option:hover {
        border-color: var(--accent);
        background: #eef2ff;
      }

      .frame-option.active {
        border-color: var(--accent);
        background: #eef2ff;
        font-weight: 700;
        color: var(--accent);
      }

      .frame-info {
        font-size: 0.85rem;
        color: var(--muted);
        margin-top: 4px;
      }

      #youtube-player,
      #local-video-player {
        width: 100%;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
      }

      #youtube-player {
        aspect-ratio: 16 / 9;
      }

      #local-video-player {
        aspect-ratio: 16 / 9;
        max-width: 100%;
        margin: 0 auto;
      }

      .video-frame-tiktok {
        aspect-ratio: 9 / 16;
        max-width: 360px;
        margin: 0 auto;
      }

      .video-frame-instagram {
        aspect-ratio: 1 / 1;
        max-width: 540px;
        margin: 0 auto;
      }

      .video-frame-standard {
        aspect-ratio: 16 / 9;
        max-width: 100%;
      }

      .controls {
        background: #f8fafc;
        border-radius: 12px;
        padding: 22px;
        margin-top: 20px;
      }

      .controls h2 {
        margin: 0 0 18px;
        color: #1f2937;
      }

      .video-info {
        background: #eef2ff;
        padding: 14px 18px;
        border-radius: 10px;
        text-align: center;
        margin-bottom: 20px;
        font-weight: 700;
        color: #312e81;
      }

      .loading-spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #7c3aed;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 10px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .clip-list {
        margin-top: 28px;
        display: grid;
        gap: 12px;
      }

      .clip-item {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 12px;
        align-items: center;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px 16px;
      }

      .clip-item .label {
        font-weight: 700;
        color: #1f2937;
      }

      .clip-item .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .small-btn {
        background: #0f172a;
        color: white;
        padding: 10px 14px;
        font-size: 0.85rem;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        transition: opacity 0.2s ease;
      }

      .small-btn.alt {
        background: #7c3aed;
      }

      .small-btn.success {
        background: #16a34a;
      }

      .small-btn:hover {
        opacity: 0.9;
      }

      .small-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .error-message {
        max-width: 820px;
        margin: 18px auto 0;
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
        border-radius: 10px;
        padding: 16px 18px;
      }

      .success-message {
        max-width: 820px;
        margin: 18px auto 0;
        background: #dcfce7;
        color: #166534;
        border: 1px solid #bbf7d0;
        border-radius: 10px;
        padding: 16px 18px;
      }

      footer {
        text-align: center;
        padding: 18px 20px 10px;
        color: #e2e8f0;
        font-size: 0.95rem;
      }

      .clip-preview-section {
        margin-top: 20px;
        padding: 16px;
        background: #f1f5f9;
        border-radius: 10px;
      }

      .clip-preview-section h3 {
        margin: 0 0 12px;
        color: #1f2937;
      }

      .time-inputs {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
        margin-bottom: 12px;
      }

      .download-progress {
        margin-top: 10px;
        padding: 12px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        text-align: center;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .progress-bar {
        width: 100%;
        height: 6px;
        background: #e2e8f0;
        border-radius: 3px;
        margin-top: 8px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: var(--accent);
        width: 0%;
        transition: width 0.1s ease;
      }

      @media (max-width: 700px) {
        .clip-item {
          grid-template-columns: 1fr;
        }
        .time-inputs {
          grid-template-columns: 1fr;
        }
        .frame-options {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <header>
          <h1>🎬 Clip-it</h1>
          <p>Create short clips from YouTube videos or your own videos</p>
        </header>

        <div class="main">
          <div class="tabs">
            <button id="youtube-tab" class="tab-button active">YouTube URL</button>
            <button id="upload-tab" class="tab-button">Upload Video</button>
          </div>

          <!-- YouTube Tab -->
          <div id="youtube-content" class="tab-content active">
            <div class="input-panel">
              <label for="youtube-url">Enter YouTube URL</label>
              <input
                type="text"
                id="youtube-url"
                placeholder="https://www.youtube.com/watch?v=..."
                required
              />
              <button id="load-video" class="primary-btn">Load Video</button>
            </div>

            <div id="video-panel" class="video-panel hidden">
              <div id="youtube-player"></div>

              <div class="controls">
                <div id="video-info" class="video-info hidden"></div>
                <div id="clip-list" class="clip-list hidden"></div>

                <div>
                  <button id="create-another" class="primary-btn">Load Another Video</button>
                </div>
              </div>
            </div>

            <div id="error-message" class="error-message hidden"></div>
          </div>

          <!-- Upload Tab -->
          <div id="upload-content" class="tab-content">
            <div class="input-panel">
              <label for="video-file">Select Video File</label>
              <input
                type="file"
                id="video-file"
                accept="video/*"
                required
              />
              <button id="upload-video" class="primary-btn">Upload & Process</button>
            </div>

            <div id="local-video-panel" class="video-panel hidden">
              <div class="video-frame-selector">
                <label>Video Frame Format:</label>
                <div class="frame-options">
                  <div class="frame-option active" data-format="standard">
                    <div>📺 Standard</div>
                    <div class="frame-info">16:9</div>
                  </div>
                  <div class="frame-option" data-format="tiktok">
                    <div>🎵 TikTok</div>
                    <div class="frame-info">9:16</div>
                  </div>
                  <div class="frame-option" data-format="instagram">
                    <div>📷 Instagram</div>
                    <div class="frame-info">1:1</div>
                  </div>
                </div>
              </div>

              <video id="local-video-player" class="video-frame-standard" controls></video>

              <div class="controls">
                <div id="local-video-info" class="video-info hidden"></div>
                
                <div class="clip-preview-section hidden" id="local-clip-preview">
                  <h3>Preview Custom Clip</h3>
                  <div class="time-inputs">
                    <div>
                      <label for="start-time" style="font-size: 0.9rem;">Start Time (seconds)</label>
                      <input type="number" id="start-time" min="0" value="0" />
                    </div>
                    <div>
                      <label for="end-time" style="font-size: 0.9rem;">End Time (seconds)</label>
                      <input type="number" id="end-time" min="0" value="60" />
                    </div>
                    <div style="display: flex; align-items: flex-end;">
                      <button id="preview-clip" class="primary-btn" style="width: 100%; padding: 10px;">Preview Clip</button>
                    </div>
                  </div>
                </div>

                <div id="local-clip-list" class="clip-list hidden"></div>

                <div>
                  <button id="upload-another" class="primary-btn">Upload Another Video</button>
                </div>
              </div>
            </div>

            <div id="upload-error-message" class="error-message hidden"></div>
            <div id="success-message" class="success-message hidden"></div>
          </div>
        </div>

        <footer>
          <p>⚠️ For personal use only. Respect copyright and creators' rights.</p>
        </footer>
      </div>
    </div>

    <script>
      const { FFmpeg, fetchFile } = FFmpeg;
      const ffmpeg = new FFmpeg.FFmpeg();

      let player;
      let videoId = null;
      let localVideoFile = null;
      let localVideoDuration = 0;
      let currentFrameFormat = "standard";
      const CLIP_DURATION_SECONDS = 60;
      const MIN_CLIPS = 10;
      const MAX_CLIPS = 50;

      // Initialize FFmpeg
      async function initFFmpeg() {
        if (!ffmpeg.isLoaded()) {
          await ffmpeg.load();
        }
      }

      // Frame format selection
      document.querySelectorAll(".frame-option").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".frame-option").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentFrameFormat = btn.dataset.format;
          updateVideoPlayerFrame();
        });
      });

      function updateVideoPlayerFrame() {
        const videoPlayer = document.getElementById("local-video-player");
        videoPlayer.className = ""; // Clear all classes

        switch (currentFrameFormat) {
          case "tiktok":
            videoPlayer.classList.add("video-frame-tiktok");
            break;
          case "instagram":
            videoPlayer.classList.add("video-frame-instagram");
            break;
          default:
            videoPlayer.classList.add("video-frame-standard");
        }
      }

      // Tab switching
      document.getElementById("youtube-tab").addEventListener("click", () => {
        document.getElementById("youtube-content").classList.add("active");
        document.getElementById("upload-content").classList.remove("active");
        document.getElementById("youtube-tab").classList.add("active");
        document.getElementById("upload-tab").classList.remove("active");
      });

      document.getElementById("upload-tab").addEventListener("click", () => {
        document.getElementById("upload-content").classList.add("active");
        document.getElementById("youtube-content").classList.remove("active");
        document.getElementById("upload-tab").classList.add("active");
        document.getElementById("youtube-tab").classList.remove("active");
      });

      // YouTube functionality
      document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("load-video").addEventListener("click", loadVideo);
        document.getElementById("create-another").addEventListener("click", resetForm);
        
        // Local video functionality
        document.getElementById("video-file").addEventListener("change", handleFileSelect);
        document.getElementById("upload-video").addEventListener("click", processLocalVideo);
        document.getElementById("upload-another").addEventListener("click", resetLocalForm);
        document.getElementById("preview-clip").addEventListener("click", previewClip);

        // Initialize FFmpeg
        initFFmpeg();
      });

      // ===== YOUTUBE FUNCTIONS =====
      function validateYouTubeURL(url) {
        const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
        const match = url.match(regex);
        return match ? match[1] : null;
      }

      function showError(message) {
        const errorElement = document.getElementById("error-message");
        errorElement.textContent = message;
        errorElement.classList.remove("hidden");
      }

      function hideError() {
        document.getElementById("error-message").classList.add("hidden");
      }

      function formatTime(totalSeconds) {
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = Math.floor(totalSeconds % 60);

        if (hours > 0) {
          return `${hours}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
        }

        return `${minutes}:${String(seconds).padStart(2, "0")}`;
      }

      function createClipLink(startTime, endTime) {
        const safeStart = Math.max(0, Number(startTime) || 0);
        const safeEnd = Math.max(safeStart + 1, Number(endTime) || safeStart + 1);
        const params = new URLSearchParams({
          v: videoId,
          start: String(safeStart),
          end: String(safeEnd)
        });
        return `https://www.youtube.com/watch?${params.toString()}`;
      }

      function copyClipLink(url) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url)
            .then(() => {
              alert("Clip link copied to clipboard.");
            })
            .catch(() => {
              alert("Copy failed. You can still use the Open Clip button.");
            });
          return;
        }

        alert("Clipboard copy is not available in this browser. Use the Open Clip button instead.");
      }

      function shareClip(url) {
        const shareData = {
          title: "Clip-it Clip",
          text: "Check out this 1-minute clip.",
          url
        };

        if (navigator.share) {
          navigator.share(shareData).catch(() => {});
          return;
        }

        const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent("Check out this 1-minute clip")}&url=${encodeURIComponent(url)}`;
        window.open(twitterUrl, "_blank", "noopener,noreferrer");
      }

      function calculateClipCount(totalSeconds) {
        const baseClipCount = Math.ceil(totalSeconds / CLIP_DURATION_SECONDS);
        
        if (baseClipCount < MIN_CLIPS) {
          return MIN_CLIPS;
        }
        if (baseClipCount > MAX_CLIPS) {
          return MAX_CLIPS;
        }
        
        return baseClipCount;
      }

      function generateMinuteClips(totalSeconds) {
        if (!videoId) {
          showError("Video ID not found.");
          return;
        }

        if (totalSeconds <= 0) {
          showError("The video duration could not be read.");
          return;
        }

        const clipCount = calculateClipCount(totalSeconds);
        const segmentSize = totalSeconds / clipCount;

        const clipList = document.getElementById("clip-list");
        clipList.innerHTML = "";
        clipList.classList.remove("hidden");

        for (let index = 0; index < clipCount; index++) {
          const startTime = Math.floor(index * segmentSize);
          const endTime = Math.floor((index + 1) * segmentSize);
          const clipUrl = createClipLink(startTime, endTime);

          const item = document.createElement("div");
          item.className = "clip-item";

          const label = document.createElement("div");
          label.className = "label";
          label.textContent = `Clip ${index + 1}: ${formatTime(startTime)} - ${formatTime(endTime)}`;

          const actions = document.createElement("div");
          actions.className = "actions";

          const openBtn = document.createElement("button");
          openBtn.className = "small-btn";
          openBtn.textContent = "Open";
          openBtn.addEventListener("click", () => window.open(clipUrl, "_blank", "noopener,noreferrer"));

          const copyBtn = document.createElement("button");
          copyBtn.className = "small-btn alt";
          copyBtn.textContent = "Copy Link";
          copyBtn.addEventListener("click", () => copyClipLink(clipUrl));

          const shareBtn = document.createElement("button");
          shareBtn.className = "small-btn alt";
          shareBtn.textContent = "Share";
          shareBtn.addEventListener("click", () => shareClip(clipUrl));

          actions.appendChild(openBtn);
          actions.appendChild(copyBtn);
          actions.appendChild(shareBtn);

          item.appendChild(label);
          item.appendChild(actions);
          clipList.appendChild(item);
        }

        hideError();
      }

      function loadVideo() {
        const url = document.getElementById("youtube-url").value.trim();
        videoId = validateYouTubeURL(url);

        if (!videoId) {
          showError("Invalid YouTube URL. Please enter a valid video URL.");
          return;
        }

        hideError();
        document.getElementById("video-panel").classList.remove("hidden");

        if (player) {
          player.destroy();
        }

        const videoInfo = document.getElementById("video-info");
        videoInfo.innerHTML = '<span class="loading-spinner"></span>Generating clips...';
        videoInfo.classList.remove("hidden");

        player = new YT.Player("youtube-player", {
          height: "100%",
          width: "100%",
          videoId,
          playerVars: {
            playsinline: 1,
            rel: 0,
            modestbranding: 1,
          },
          events: {
            onReady: (event) => {
              setTimeout(() => {
                const duration = Math.floor(event.target.getDuration());
                generateMinuteClips(duration);

                videoInfo.innerHTML = `✅ Video loaded! Duration: ${formatTime(duration)} | Generated ${calculateClipCount(duration)} clips`;
              }, 500);
            },
            onStateChange: (event) => {
              // Handle state changes if needed
            },
          },
        });
      }

      function resetForm() {
        document.getElementById("youtube-url").value = "";
        document.getElementById("video-panel").classList.add("hidden");
        document.getElementById("clip-list").classList.add("hidden");
        document.getElementById("video-info").classList.add("hidden");
        document.getElementById("clip-list").innerHTML = "";

        if (player) {
          player.destroy();
          player = null;
        }
      }

      // ===== LOCAL VIDEO FUNCTIONS =====
      function showLocalError(message) {
        const errorElement = document.getElementById("upload-error-message");
        errorElement.textContent = message;
        errorElement.classList.remove("hidden");
      }

      function hideLocalError() {
        document.getElementById("upload-error-message").classList.add("hidden");
      }

      function showSuccessMessage(message) {
        const successElement = document.getElementById("success-message");
        successElement.textContent = message;
        successElement.classList.remove("hidden");
      }

      function hideSuccessMessage() {
        document.getElementById("success-message").classList.add("hidden");
      }

      function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
          localVideoFile = file;
          hideLocalError();
        }
      }

      function processLocalVideo() {
        if (!localVideoFile) {
          showLocalError("Please select a video file first.");
          return;
        }

        const validTypes = ["video/mp4", "video/webm", "video/ogg", "video/quicktime"];
        if (!validTypes.includes(localVideoFile.type)) {
          showLocalError("Invalid video format. Supported formats: MP4, WebM, Ogg, MOV");
          return;
        }

        const videoElement = document.getElementById("local-video-player");
        const fileURL = URL.createObjectURL(localVideoFile);
        videoElement.src = fileURL;

        document.getElementById("local-video-panel").classList.remove("hidden");
        hideLocalError();

        // Wait for metadata to be loaded
        videoElement.addEventListener("loadedmetadata", function onMetadataLoaded() {
          localVideoDuration = Math.floor(videoElement.duration);
          
          if (localVideoDuration <= 0) {
            showLocalError("Could not read video duration.");
            videoElement.removeEventListener("loadedmetadata", onMetadataLoaded);
            return;
          }

          const videoInfo = document.getElementById("local-video-info");
          videoInfo.innerHTML = `✅ Video loaded! Duration: ${formatTime(localVideoDuration)}`;
          videoInfo.classList.remove("hidden");

          // Generate automatic 1-minute clips
          generateLocalMinuteClips(localVideoDuration);

          // Show manual clip preview section
          document.getElementById("local-clip-preview").classList.remove("hidden");
          document.getElementById("end-time").value = Math.min(60, localVideoDuration);

          videoElement.removeEventListener("loadedmetadata", onMetadataLoaded);
        });
      }

      function generateLocalMinuteClips(totalSeconds) {
        if (totalSeconds <= 0) {
          showLocalError("The video duration could not be read.");
          return;
        }

        const clipCount = calculateClipCount(totalSeconds);
        const segmentSize = totalSeconds / clipCount;

        const clipList = document.getElementById("local-clip-list");
        clipList.innerHTML = "";
        clipList.classList.remove("hidden");

        for (let index = 0; index < clipCount; index++) {
          const startTime = Math.floor(index * segmentSize);
          const endTime = Math.floor((index + 1) * segmentSize);

          const item = document.createElement("div");
          item.className = "clip-item";

          const label = document.createElement("div");
          label.className = "label";
          label.textContent = `Clip ${index + 1}: ${formatTime(startTime)} - ${formatTime(endTime)}`;

          const actions = document.createElement("div");
          actions.className = "actions";

          const playBtn = document.createElement("button");
          playBtn.className = "small-btn";
          playBtn.textContent = "Play";
          playBtn.addEventListener("click", () => playLocalClip(startTime, endTime));

          const downloadBtn = document.createElement("button");
          downloadBtn.className = "small-btn alt";
          downloadBtn.textContent = "Download";
          downloadBtn.addEventListener("click", () => downloadClip(startTime, endTime, index + 1));

          actions.appendChild(playBtn);
          actions.appendChild(downloadBtn);

          item.appendChild(label);
          item.appendChild(actions);
          clipList.appendChild(item);
        }

        hideLocalError();
      }

      function playLocalClip(startTime, endTime) {
        const videoElement = document.getElementById("local-video-player");
        videoElement.currentTime = startTime;
        videoElement.play();

        // Show a message when the clip ends
        const checkTime = setInterval(() => {
          if (videoElement.currentTime >= endTime) {
            videoElement.pause();
            clearInterval(checkTime);
          }
        }, 100);
      }

      function previewClip() {
        const startTime = parseFloat(document.getElementById("start-time").value) || 0;
        let endTime = parseFloat(document.getElementById("end-time").value) || 60;

        if (isNaN(startTime) || isNaN(endTime)) {
          showLocalError("Please enter valid time values.");
          return;
        }

        if (startTime >= endTime) {
          showLocalError("Start time must be less than end time.");
          return;
        }

        if (startTime < 0 || endTime > localVideoDuration) {
          showLocalError(`Times must be between 0 and ${localVideoDuration} seconds.`);
          return;
        }

        playLocalClip(startTime, endTime);
        showSuccessMessage(`Playing clip: ${formatTime(startTime)} - ${formatTime(endTime)}`);
      }

      async function downloadClip(startTime, endTime, clipNumber) {
        const downloadBtn = event.target;
        downloadBtn.disabled = true;
        downloadBtn.textContent = "Processing...";

        try {
          showLocalError("");
          showSuccessMessage("Processing video clip... This may take a moment.");

          // Get aspect ratio based on selected format
          let scale = "";
          switch (currentFrameFormat) {
            case "tiktok":
              scale = "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2";
              break;
            case "instagram":
              scale = "scale=1080:1080:force_original_aspect_ratio=decrease,pad=1080:1080:(ow-iw)/2:(oh-ih)/2";
              break;
            default:
              scale = "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2";
          }

          const videoData = await localVideoFile.arrayBuffer();
          ffmpeg.writeFile("input.mp4", new Uint8Array(videoData));

          // FFmpeg command to extract clip with proper scaling
          const ffmpegCommand = [
            "-i", "input.mp4",
            "-ss", startTime.toString(),
            "-to", endTime.toString(),
            "-vf", scale,
            "-c:v", "libx264",
            "-preset", "fast",
            "-c:a", "aac",
            "-b:a", "128k",
            "output.mp4"
          ];

          await ffmpeg.exec(...ffmpegCommand);

          // Read the output file
          const data = ffmpeg.readFile("output.mp4");
          const blob = new Blob([data.buffer], { type: "video/mp4" });
          const url = URL.createObjectURL(blob);

          // Create download link
          const a = document.createElement("a");
          a.href = url;
          a.download = `clip-${clipNumber}-${currentFrameFormat}.mp4`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          // Clean up FFmpeg files
          ffmpeg.deleteFile("input.mp4");
          ffmpeg.deleteFile("output.mp4");

          showSuccessMessage(`✅ Clip ${clipNumber} downloaded successfully!`);
        } catch (error) {
          console.error("Download error:", error);
          showLocalError(`Error downloading clip: ${error.message}`);
        } finally {
          downloadBtn.disabled = false;
          downloadBtn.textContent = "Download";
        }
      }

      function resetLocalForm() {
        document.getElementById("video-file").value = "";
        document.getElementById("local-video-panel").classList.add("hidden");
        document.getElementById("local-clip-list").classList.add("hidden");
        document.getElementById("local-video-info").classList.add("hidden");
        document.getElementById("local-clip-preview").classList.add("hidden");
        document.getElementById("local-clip-list").innerHTML = "";
        
        const videoElement = document.getElementById("local-video-player");
        videoElement.src = "";
        videoElement.pause();

        localVideoFile = null;
        localVideoDuration = 0;
        hideLocalError();
        hideSuccessMessage();
      }
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
  </body>
</html>
