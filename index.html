<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clip-it | YouTube Video Clipper</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#172033;background:#f8fafc}body{max-width:960px;margin:0 auto;padding:24px}main{background:white;padding:24px;border-radius:16px;box-shadow:0 8px 30px #0001}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #ccd3df}input{width:min(100%,700px)}button{cursor:pointer;background:#673ab7;color:white;border:0;font-weight:700}.clips{display:grid;gap:10px;margin-top:20px}.clip{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;background:#f1f5f9;border-radius:10px}.clip a{color:white;background:#15803d;padding:9px 12px;border-radius:7px;text-decoration:none;font-weight:700;white-space:nowrap}.status{margin-top:16px;color:#475569}.error{color:#b91c1c}@media(max-width:650px){.clip{display:block}.clip a{display:inline-block;margin-top:10px}}
  </style>
</head>
<body>
<main>
  <h1>🎬 Clip-it</h1>
  <p>Paste a YouTube link to create downloadable one-minute clips automatically.</p>
  <form id="form">
    <input id="url" type="url" required placeholder="https://www.youtube.com/watch?v=..." aria-label="YouTube URL">
    <button type="submit">Generate clips</button>
  </form>
  <p id="status" class="status"></p>
  <section id="clips" class="clips" aria-live="polite"></section>
</main>
<script>
  const $ = id => document.getElementById(id);
  const CLIP_SECONDS = 60, MIN_CLIPS = 10, MAX_CLIPS = 50;
  function videoId(value) {
    try {
      const url = new URL(value);
      if (url.hostname === 'youtu.be') return url.pathname.slice(1).split('/')[0];
      if (url.hostname.endsWith('youtube.com')) {
        if (url.pathname === '/watch') return url.searchParams.get('v');
        const parts = url.pathname.split('/').filter(Boolean);
        if (['embed','shorts','v'].includes(parts[0])) return parts[1];
      }
    } catch (_) {}
    return null;
  }
  function time(seconds) { const m=Math.floor(seconds/60), s=seconds%60; return `${m}:${String(s).padStart(2,'0')}`; }
  function count(duration) { return Math.min(MAX_CLIPS, Math.max(MIN_CLIPS, Math.ceil(duration / CLIP_SECONDS))); }
  function render(id, duration) {
    const total = count(duration), size = duration / total, list = $('clips'); list.innerHTML='';
    for (let i=0;i<total;i++) {
      const start=Math.floor(i*size), end=Math.max(start+1, Math.floor((i+1)*size));
      const row=document.createElement('div'); row.className='clip';
      row.innerHTML=`<span><strong>Clip ${i+1}</strong>: ${time(start)} – ${time(end)}</span><a href="/api/clip?videoId=${encodeURIComponent(id)}&start=${start}&end=${end}" download="clip-${i+1}.mp4">Download MP4</a>`;
      list.appendChild(row);
    }
  }
  $('form').addEventListener('submit', async event => {
    event.preventDefault(); $('clips').innerHTML=''; $('status').className='status';
    const id=videoId($('url').value.trim());
    if (!id) { $('status').textContent='Enter a valid YouTube video URL.'; $('status').className='status error'; return; }
    $('status').textContent='Reading video duration…';
    try {
      const response=await fetch(`/api/video-info?videoId=${encodeURIComponent(id)}`);
      const data=await response.json(); if (!response.ok) throw new Error(data.error || 'Could not read the video.');
      render(id, data.duration); $('status').textContent=`Generated ${count(data.duration)} clips from a ${time(data.duration)} video.`;
    } catch (error) { $('status').textContent=error.message; $('status').className='status error'; }
  });
</script>
</body>
</html>
